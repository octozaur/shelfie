<!DOCTYPE html>
<!--
  Source of the README banner and the social preview.
  Render (macOS, Chrome):
    CH="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
    "$CH" --headless=new --hide-scrollbars --force-device-scale-factor=2 --window-size=1280,400 \
      --screenshot=banner-light.png "file://$PWD/banner.html?theme=light"
    ... ?theme=dark → banner-dark.png
    --window-size=1280,640 "...banner.html?theme=light&social=1" → social-preview.png (use scale factor 1)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shelfie banner</title>
<style>
  html,body{margin:0;padding:0}
  body{width:1280px;height:400px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif}
  body.social{height:640px}
  body.light{--bg:#f7f6f3;--ink:#1b1b1a;--ink2:#5c5b57;--ink3:#9a988f;--line:#e2e0d9;--panel:#fff;--shadow:rgba(27,27,26,.18)}
  body.dark{--bg:#121212;--ink:#efeee9;--ink2:#a8a69f;--ink3:#6f6d67;--line:#2a2a28;--panel:#1a1a19;--shadow:rgba(0,0,0,.6)}
  body{background:var(--bg);color:var(--ink)}
  .stage{position:absolute;left:0;top:0;width:1280px;height:400px}
  body.social .stage{top:120px}

  .left{position:absolute;left:84px;top:84px}
  .eyebrow{font:500 15px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
  .word{font-size:104px;font-weight:720;letter-spacing:-.045em;line-height:1;margin:18px 0 18px}
  .tag{font-size:25px;line-height:1.35;color:var(--ink2);max-width:500px;letter-spacing:-.01em}

  .items{position:absolute;left:668px;right:92px;bottom:116px;display:flex;align-items:flex-end;justify-content:center;gap:13px}
  .ic{flex:none;display:grid;place-items:center;border-radius:22%;color:#fff;background:var(--c);position:relative;
      box-shadow:0 10px 18px -12px var(--shadow)}
  .ic svg{width:46%;height:46%;max-width:52px;max-height:52px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bd{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font:600 11px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.02em;
      padding:3px 5px;border-radius:5px;background:var(--panel);color:var(--c);border:1px solid var(--line);white-space:nowrap}
  .lean{transform:rotate(-9deg);transform-origin:bottom left}
  .c-art{--c:#d97757}.c-html{--c:#f76b15}.c-pdf{--c:#e5484d}.c-slides{--c:#e2a336}.c-sheet{--c:#30a46c}.c-srv{--c:#8e4ec6}

  .shelf{position:absolute;left:640px;right:64px;top:292px;height:14px;border-radius:4px;background:var(--ink)}
  .shelf::after{content:"";position:absolute;left:14px;right:14px;top:14px;height:28px;background:linear-gradient(var(--shadow),transparent);filter:blur(5px)}
  .bracket{position:absolute;top:306px;width:10px;height:34px;border-radius:0 0 4px 4px;background:var(--ink);opacity:.85}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-art" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/></symbol>
  <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M8.5 16.5h7M8.5 13h4"/></symbol>
  <symbol id="i-html" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M13.5 5l-3 14"/></symbol>
  <symbol id="i-slides" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></symbol>
  <symbol id="i-sheet" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16"/></symbol>
  <symbol id="i-srv" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 10 3 2-3 2M12.5 14.5H17"/></symbol>
</svg>
<div class="stage">
  <div class="left">
    <div class="eyebrow">Claude Code plugin</div>
    <div class="word">Shelfie</div>
    <div class="tag">Every artifact Claude makes — dated, described, and on one shelf.</div>
  </div>
  <div class="items">
    <span class="ic c-slides" style="width:84px;height:84px"><svg><use href="#i-slides"/></svg><span class="bd">PPTX</span></span>
    <span class="ic c-pdf" style="width:64px;height:108px"><svg><use href="#i-pdf"/></svg><span class="bd">PDF</span></span>
    <span class="ic c-art" style="width:98px;height:98px"><svg><use href="#i-art"/></svg><span class="bd">ARTIFACT</span></span>
    <span class="ic c-sheet" style="width:74px;height:74px"><svg><use href="#i-sheet"/></svg><span class="bd">XLSX</span></span>
    <span class="ic c-html" style="width:62px;height:118px"><svg><use href="#i-html"/></svg><span class="bd">HTML</span></span>
    <span class="ic c-srv lean" style="width:78px;height:78px"><svg><use href="#i-srv"/></svg><span class="bd">SERVER</span></span>
  </div>
  <div class="shelf"></div>
  <div class="bracket" style="left:700px"></div>
  <div class="bracket" style="left:1186px"></div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  document.body.className = (q.get("theme") === "dark" ? "dark" : "light") + (q.get("social") ? " social" : "");
</script>
</body>
</html>
