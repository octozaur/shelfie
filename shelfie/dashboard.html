<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__SHELFIE_TITLE__</title>
<style>
  :root{
    --bg:#f7f6f3; --panel:#ffffff; --ink:#1b1b1a; --ink-2:#5c5b57; --ink-3:#9a988f;
    --line:#e7e5df; --accent:#2f5bea;
    --h0:#ecebe6; --h1:#c9d5fb; --h2:#8fa8f5; --h3:#4f76ee; --h4:#2447c4;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121212; --panel:#1a1a19; --ink:#efeee9; --ink-2:#a8a69f; --ink-3:#6f6d67;
      --line:#2a2a28; --accent:#7d9bff;
      --h0:#222220; --h1:#1f2b52; --h2:#2c4290; --h3:#4366d6; --h4:#7d9bff;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:40px 24px 80px}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
  .eyebrow{font:500 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px;overflow-wrap:anywhere}
  h1{font-size:30px;font-weight:650;letter-spacing:-.02em;margin:0}
  .stats{display:flex;gap:22px;font-size:12px;color:var(--ink-2)}
  .stats b{display:block;font:600 18px/1.2 var(--sans);color:var(--ink)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
  .heat{padding:18px 20px 14px;margin-bottom:18px}
  .heat-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;color:var(--ink-2)}
  .months{display:grid;grid-template-columns:repeat(26,1fr);gap:4px;font:10px var(--mono);color:var(--ink-3);margin-bottom:5px;white-space:nowrap}
  .grid{display:grid;grid-template-columns:repeat(26,1fr);grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px}
  .grid button{aspect-ratio:1;border:0;padding:0;border-radius:3px;background:var(--h0);cursor:pointer;transition:transform .12s}
  .grid button:hover{transform:scale(1.35)}
  .grid button.future{visibility:hidden}
  .grid .l1{background:var(--h1)} .grid .l2{background:var(--h2)} .grid .l3{background:var(--h3)} .grid .l4{background:var(--h4)}
  .grid button.sel{outline:2px solid var(--ink);outline-offset:1px}
  .legend{display:flex;align-items:center;gap:4px;font:10px var(--mono);color:var(--ink-3)}
  .legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

  .bar{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0 12px;margin-bottom:18px}
  .search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 12px;color:var(--ink-3);margin-bottom:10px}
  .search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:14px var(--sans);padding:9px 0;outline:none}
  .search kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  .types{display:flex;flex-wrap:wrap;gap:6px}
  .tchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border:1px solid var(--line);border-radius:20px;background:var(--panel);font-size:12px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
  .tchip.all{padding-left:10px}
  .tchip.on{border-color:var(--ink);color:var(--ink)}
  .tchip.zero{opacity:.45}
  .tchip .ic{width:20px;height:20px;border-radius:6px}
  .tchip .ic svg{width:12px;height:12px}
  .tchip em{font:10px var(--mono);font-style:normal;color:var(--ink-3)}
  .dayfilter{display:none;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--ink-2)}
  .dayfilter.on{display:flex}
  .dayfilter button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:2px 10px;cursor:pointer;font-size:12px}

  .ic{flex:none;display:grid;place-items:center;border-radius:10px;color:#fff;background:var(--c)}
  .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  .group{margin-bottom:26px}
  .gh{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
  .gh h2{font-size:13px;font-weight:600;margin:0}
  .gh small{font:11px var(--mono);color:var(--ink-3)}
  .gh::after{content:"";flex:1;border-bottom:1px solid var(--line);transform:translateY(-4px)}

  .item{display:grid;grid-template-columns:44px 1fr auto;gap:14px;padding:12px 14px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:background .15s}
  .item > *{min-width:0}
  .item:hover{background:var(--panel)}
  .item.open{background:var(--panel);border-color:var(--line);cursor:default}
  .item > .ic{width:44px;height:44px;position:relative}
  .item.missing > .ic{filter:grayscale(1);opacity:.5}
  .item.missing .title{color:var(--ink-3)}
  .badge{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);font:600 7.5px/1 var(--mono);letter-spacing:0;padding:2px 3px;border-radius:4px;background:var(--panel);color:var(--c);border:1px solid var(--line);white-space:nowrap}
  .title{font-weight:600;font-size:15px;letter-spacing:-.01em;overflow-wrap:anywhere}
  .muted{font:500 11px var(--mono);color:var(--ink-3);margin-left:6px;letter-spacing:0}
  .desc{color:var(--ink-2);margin-top:1px;overflow-wrap:anywhere}
  .where{margin-top:6px;font:11px var(--mono);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font:11px var(--mono);color:var(--ink-3);white-space:nowrap}
  .chip{border:1px solid var(--line);border-radius:20px;padding:2px 8px}
  .chip.warn{border-color:transparent;background:var(--h0)}

  .details{grid-column:2 / 4;margin-top:4px;padding-top:12px;border-top:1px dashed var(--line)}
  .files{font:12px var(--mono);color:var(--ink-2);margin:0 0 12px 16px;padding:0;list-style:none}
  .files li{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:12px var(--sans)}
  .row{display:grid;grid-template-columns:120px 1fr;gap:12px;position:relative;padding:0 0 12px 16px}
  .row::before{content:"";position:absolute;left:3px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--c)}
  .row::after{content:"";position:absolute;left:6px;top:16px;bottom:-2px;width:1px;background:var(--line)}
  .row:last-of-type::after{display:none}
  .when{font:11px var(--mono);color:var(--ink-3);padding-top:1px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;padding-left:16px}
  .btn{font:12px var(--sans);padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
  .btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}

  .empty{text-align:center;color:var(--ink-3);padding:60px 0}
  .empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}
  details.ignored{margin-top:36px;color:var(--ink-3)}
  details.ignored summary{cursor:pointer;font-size:12px}
  details.ignored .item{opacity:.6}
  footer{margin-top:40px;font:11px var(--mono);color:var(--ink-3)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:12px;transition:.2s;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%)}

  @media (max-width:640px){
    .wrap{padding:28px 16px 60px}
    header{flex-direction:column;align-items:flex-start}
    .heat{padding:14px 12px 12px}
    .grid,.months{gap:2px}
    .grid button{border-radius:2px}
    .types{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
    .types::-webkit-scrollbar{display:none}
    .item{grid-template-columns:40px 1fr;gap:12px;padding:12px 10px}
    .item > .ic{width:40px;height:40px}
    .right{grid-column:2;flex-direction:row;align-items:center}
    .details{grid-column:1 / 3}
    .row{grid-template-columns:1fr;gap:0}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-artifact" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/></symbol>
  <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M8.5 16.5h7M8.5 13h4"/></symbol>
  <symbol id="i-html" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M13.5 5l-3 14"/></symbol>
  <symbol id="i-md" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M6.5 15V9l2.5 3 2.5-3v6M16.5 9v6m-2-2 2 2 2-2"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M8.5 12h7M8.5 15h7M8.5 18h4"/></symbol>
  <symbol id="i-slides" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></symbol>
  <symbol id="i-sheet" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16"/></symbol>
  <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 10 3 2-3 2M12.5 14.5H17"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-9 9"/></symbol>
</svg>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1>Artifacts</h1>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <section class="card heat" aria-label="Activity">
    <div class="heat-top"><span>Activity · last 6 months</span>
      <span class="legend">less <i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i> more</span></div>
    <div class="months" id="months"></div>
    <div class="grid" id="grid"></div>
  </section>

  <div class="bar">
    <label class="search">⌕<input id="q" type="search" placeholder="Search titles, descriptions, changes…" autocomplete="off"><kbd>/</kbd></label>
    <div class="types" id="types"></div>
    <div class="dayfilter" id="dayfilter"><span id="daylabel"></span><button type="button" id="dayclear">Clear</button></div>
  </div>

  <main id="list"></main>
  <details class="ignored" id="ignored"><summary></summary><div></div></details>
  <footer id="footer"></footer>
</div>
<div class="toast" id="toast"></div>

<script id="data" type="application/json">__SHELFIE_DATA__</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var TYPES = DATA.types;
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var state = { q: "", type: null, day: null, open: {} };

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function dayKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function hm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function short(d) { return MONTHS[d.getMonth()].slice(0, 3) + " " + d.getDate(); }
  function color(t) { return (TYPES[t] || TYPES.artifact || { color: "#888" }).color; }
  function fileUrl(p) { return "file://" + encodeURI(p).replace(/#/g, "%23").replace(/\?/g, "%3F"); }

  var now = new Date(), today = startOfDay(now);
  var yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  var weekStart = new Date(today); weekStart.setDate(today.getDate() - ((today.getDay() + 6) % 7));

  DATA.entries.forEach(function (e) {
    e._updated = new Date(e.updated_at);
    e._created = new Date(e.created_at);
    var days = {};
    days[dayKey(e._created)] = 1;
    (e.changes || []).forEach(function (c) { days[dayKey(new Date(c.at))] = 1; });
    days[dayKey(e._updated)] = 1;
    e._days = days;
    e._search = [e.title, e.description, e.path, e.url, e.server && e.server.command, e.server && e.server.name]
      .concat((e.changes || []).map(function (c) { return c.note; }))
      .filter(Boolean).join(" \u0001 ").toLowerCase();
  });
  var visible = DATA.entries.filter(function (e) { return e.status !== "ignored"; });
  var ignored = DATA.entries.filter(function (e) { return e.status === "ignored"; });

  function titleOf(e) {
    if (e.title) return e.title;
    if (e.server) return e.server.name || e.server.command || ("localhost:" + e.server.port);
    if (e.path) return e.path.replace(/\/$/, "").split("/").pop() || e.path;
    return e.url || "Untitled";
  }
  function whereOf(e) {
    if (e.server) {
      var s = e.server, parts = [];
      if (s.port) parts.push("localhost:" + s.port);
      if (s.command) parts.push(s.command);
      if (s.cwd && s.cwd !== ".") parts.push(s.cwd + "/");
      return parts.join(" · ");
    }
    var parts2 = [];
    if (e.url) parts2.push(e.url.replace(/^https:\/\//, ""));
    if (e.path) parts2.push(e.files ? e.path + " · " + e.files.length + " files" : e.path);
    return parts2.join(" · ");
  }
  function badgeOf(e) {
    var t = TYPES[e.type];
    return t ? t.badge : e.type.toUpperCase();
  }
  function timeLabel(d) {
    if (d >= today) return hm(d);
    if (d >= yesterday) return "Yesterday";
    if (d >= weekStart) return WD[d.getDay()];
    return short(d) + (d.getFullYear() !== now.getFullYear() ? " " + d.getFullYear() : "");
  }
  function icon(type, size) {
    var s = el("span", "ic");
    s.style.setProperty("--c", color(type));
    var svgns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgns, "svg");
    var use = document.createElementNS(svgns, "use");
    use.setAttribute("href", "#i-" + (TYPES[type] || type === "artifact" ? type : "html"));
    svg.appendChild(use);
    s.appendChild(svg);
    return s;
  }

  function toast(msg) {
    var t = $("toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove("on"); }, 1400);
  }
  function copy(text, what) {
    function fallback() {
      var ta = el("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast(what + " copied"); } catch (err) { toast("Copy failed"); }
      ta.remove();
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { toast(what + " copied"); }, fallback);
    } else fallback();
  }

  // header
  $("eyebrow").textContent = DATA.project + " · artifact log";
  document.title = "Artifacts · " + DATA.project;
  var monthCount = visible.filter(function (e) { return e._created.getFullYear() === now.getFullYear() && e._created.getMonth() === now.getMonth(); }).length;
  var todayCount = visible.filter(function (e) { return e._updated >= today; }).length;
  [[visible.length, "total"], [monthCount, "this month"], [todayCount, "today"]].forEach(function (p) {
    var d = el("div"); d.appendChild(el("b", null, String(p[0]))); d.appendChild(document.createTextNode(p[1])); $("stats").appendChild(d);
  });

  // activity map: 26 weeks, Monday-first columns, ending with the current week
  var counts = {};
  visible.forEach(function (e) { Object.keys(e._days).forEach(function (k) { counts[k] = (counts[k] || 0) + 1; }); });
  var start = new Date(weekStart); start.setDate(start.getDate() - 25 * 7);
  var grid = $("grid"), months = $("months"), lastMonth = -1;
  for (var w = 0; w < 26; w++) {
    var colDay = new Date(start); colDay.setDate(start.getDate() + w * 7);
    var lab = el("div");
    if (colDay.getMonth() !== lastMonth && (w > 0 || colDay.getDate() <= 7)) { lab.textContent = MONTHS[colDay.getMonth()].slice(0, 3); }
    lastMonth = colDay.getMonth();
    months.appendChild(lab);
    for (var d = 0; d < 7; d++) {
      var day = new Date(start); day.setDate(start.getDate() + w * 7 + d);
      var k = dayKey(day), n = counts[k] || 0;
      var b = el("button");
      b.type = "button";
      if (day > today) { b.className = "future"; b.tabIndex = -1; }
      else {
        b.className = n === 0 ? "" : n === 1 ? "l1" : n === 2 ? "l2" : n <= 4 ? "l3" : "l4";
        b.title = short(day) + " · " + n + (n === 1 ? " artifact" : " artifacts");
        b.dataset.day = k;
        b.setAttribute("aria-label", b.title);
      }
      grid.appendChild(b);
    }
  }
  grid.addEventListener("click", function (ev) {
    var k = ev.target.dataset && ev.target.dataset.day;
    if (!k) return;
    state.day = state.day === k ? null : k;
    draw();
  });
  $("dayclear").addEventListener("click", function () { state.day = null; draw(); });

  // search
  var q = $("q");
  q.addEventListener("input", function () { state.q = q.value.trim().toLowerCase(); draw(); });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "/" && document.activeElement !== q) { ev.preventDefault(); q.focus(); }
    else if (ev.key === "Escape" && document.activeElement === q) { q.value = ""; state.q = ""; draw(); q.blur(); }
  });

  function matches(e, skipType) {
    if (!skipType && state.type && e.type !== state.type) return false;
    if (state.day && !e._days[state.day]) return false;
    if (state.q && e._search.indexOf(state.q) === -1) return false;
    return true;
  }

  function drawTypes() {
    var box = $("types"); box.textContent = "";
    var pool = visible.filter(function (e) { return matches(e, true); });
    function chip(key, label, n) {
      var c = el("span", "tchip" + (key ? "" : " all") + (state.type === key ? " on" : "") + (n === 0 && key ? " zero" : ""));
      c.setAttribute("role", "button"); c.tabIndex = 0;
      if (key) c.appendChild(icon(key));
      c.appendChild(document.createTextNode(label + " "));
      c.appendChild(el("em", null, String(n)));
      c.onclick = function () { state.type = state.type === key ? null : key; draw(); };
      c.onkeydown = function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); c.onclick(); } };
      box.appendChild(c);
    }
    chip(null, "All", pool.length);
    Object.keys(TYPES).forEach(function (k) {
      chip(k, TYPES[k].label, pool.filter(function (e) { return e.type === k; }).length);
    });
  }

  function groupOf(e) {
    var d = e._updated;
    if (d >= today) return ["Today", WD[d.getDay()] + ", " + short(d)];
    if (d >= yesterday) return ["Yesterday", WD[d.getDay()] + ", " + short(d)];
    if (d >= weekStart) {
      var last = new Date(yesterday); last.setDate(last.getDate() - 1);
      return ["This week", short(weekStart) === short(last) ? short(last) : short(weekStart) + " – " + short(last)];
    }
    var name = MONTHS[d.getMonth()] + (d.getFullYear() !== now.getFullYear() ? " " + d.getFullYear() : "");
    return [name, null];
  }

  function itemNode(e, compact) {
    var it = el("div", "item" + (e.exists === false ? " missing" : "") + (state.open[e.id] ? " open" : ""));
    it.style.setProperty("--c", color(e.type));
    var ic = icon(e.type);
    ic.appendChild(el("span", "badge", badgeOf(e)));
    it.appendChild(ic);

    var mid = el("div");
    var t = el("div", "title", titleOf(e));
    if (e.status === "pending") t.appendChild(el("span", "muted", "awaiting description"));
    if (e.exists === false) t.appendChild(el("span", "muted", "missing"));
    mid.appendChild(t);
    if (e.description) mid.appendChild(el("div", "desc", e.description));
    var where = whereOf(e);
    if (where) { var w = el("div", "where", where); w.title = where; mid.appendChild(w); }
    it.appendChild(mid);

    var right = el("div", "right");
    right.appendChild(el("span", null, timeLabel(e._updated)));
    var n = (e.changes || []).length;
    if (n) right.appendChild(el("span", "chip", n + (n === 1 ? " change" : " changes")));
    it.appendChild(right);

    if (state.open[e.id]) it.appendChild(detailsNode(e));
    it.addEventListener("click", function (ev) {
      if (ev.target.closest(".details")) return;
      state.open[e.id] = !state.open[e.id];
      it.replaceWith(itemNode(e, compact));
    });
    return it;
  }

  function detailsNode(e) {
    var box = el("div", "details");
    if (e.files && e.files.length) {
      var ul = el("ul", "files"), all = e._allFiles;
      var shown = all ? e.files : e.files.slice(0, 10);
      shown.forEach(function (f) { ul.appendChild(el("li", null, f)); });
      if (e.files.length > 10 && !all) {
        var li = el("li"), more = el("button", "linkbtn", "Show all " + e.files.length + " files");
        more.type = "button";
        more.onclick = function () { e._allFiles = true; box.replaceWith(detailsNode(e)); };
        li.appendChild(more); ul.appendChild(li);
      }
      box.appendChild(ul);
    }
    var changes = (e.changes || []).slice().reverse();
    if (!changes.length) changes = [{ at: e.created_at, note: e.status === "pending" ? "Detected — awaiting description" : "Created" }];
    changes.forEach(function (c) {
      var d = new Date(c.at), row = el("div", "row");
      row.appendChild(el("div", "when", short(d) + (d.getFullYear() !== now.getFullYear() ? " " + d.getFullYear() : "") + " · " + hm(d)));
      row.appendChild(el("div", null, c.note));
      box.appendChild(row);
    });
    var acts = el("div", "actions");
    function btn(label, primary, fn) {
      var b = el("button", "btn" + (primary ? " primary" : ""), label);
      b.type = "button"; b.onclick = fn; acts.appendChild(b);
    }
    function link(label, href) {
      var a = el("a", "btn", label); a.href = href; a.target = "_blank"; a.rel = "noopener"; acts.appendChild(a);
    }
    if (e.url) { btn("Copy link", true, function () { copy(e.url, "Link"); }); link("Open", e.url); }
    if (e.server) {
      if (e.server.command) btn("Copy command", !e.url, function () {
        var cmd = (e.server.cwd && e.server.cwd !== "." ? "cd " + e.server.cwd + " && " : "") + e.server.command;
        copy(cmd, "Command");
      });
      if (e.server.port) link("Open", "http://localhost:" + e.server.port);
    }
    if (e.abs_path) {
      if (!e.url && e.exists !== false) link("Open", fileUrl(e.abs_path));
      btn("Copy path", !e.url && !e.server, function () { copy(e.abs_path, "Path"); });
    }
    box.appendChild(acts);
    return box;
  }

  function draw() {
    drawTypes();
    var dayOn = !!state.day;
    $("dayfilter").classList.toggle("on", dayOn);
    if (dayOn) {
      var p = state.day.split("-");
      $("daylabel").textContent = "Showing " + short(new Date(+p[0], +p[1] - 1, +p[2])) + ", " + p[0];
    }
    Array.prototype.forEach.call(grid.children, function (b) { b.classList.toggle("sel", b.dataset.day === state.day); });

    var list = $("list"); list.textContent = "";
    var items = visible.filter(function (e) { return matches(e); })
      .sort(function (a, b) { return b._updated - a._updated; });
    if (!items.length) {
      var em = el("div", "empty");
      em.appendChild(el("b", null, visible.length ? "Nothing matches" : "No artifacts yet"));
      em.appendChild(document.createTextNode(visible.length ? "Try another search, type or day." :
        "Things Claude makes in this project will show up here."));
      list.appendChild(em);
    }
    var cur = null, sec = null;
    items.forEach(function (e) {
      var g = groupOf(e);
      if (!cur || cur !== g[0]) {
        cur = g[0];
        sec = el("section", "group");
        var gh = el("div", "gh");
        gh.appendChild(el("h2", null, g[0]));
        var cnt = items.filter(function (x) { return groupOf(x)[0] === g[0]; }).length;
        gh.appendChild(el("small", null, g[1] ? g[1] : cnt + (cnt === 1 ? " artifact" : " artifacts")));
        sec.appendChild(gh);
        list.appendChild(sec);
      }
      sec.appendChild(itemNode(e));
    });

    var ig = $("ignored");
    ig.style.display = ignored.length ? "" : "none";
    ig.querySelector("summary").textContent = "Ignored (" + ignored.length + ") — items Claude judged not to be artifacts";
    var ib = ig.querySelector("div"); ib.textContent = "";
    ignored.slice().sort(function (a, b) { return b._updated - a._updated; })
      .forEach(function (e) { ib.appendChild(itemNode(e, true)); });
  }

  var gen = new Date(DATA.generated_at);
  $("footer").textContent = "Updated " + short(gen) + " " + hm(gen) + " · Shelfie";
  draw();
})();
</script>
</body>
</html>
